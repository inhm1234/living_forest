name: Deploy TodayForest to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todayforest-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify, smoke test, and deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production artifact
        run: bash scripts/build-production.sh

      - name: Verify production artifact
        run: bash scripts/verify-production.sh

      - name: Install smoke-test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run safe smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: todayforest-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Deploy verified dist to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=todayforest --branch=main
